apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "graphwise-workflows.fullname" . }}
  namespace: {{ include "graphwise-workflows.namespace" . }}
  labels:
    {{- include "graphwise-workflows.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
data:
  # See https://docs.n8n.io/hosting/configuration/environment-variables
  {{- if not (hasKey .Values.configuration.environment "N8N_USER_FOLDER") }}
  N8N_USER_FOLDER: {{ tpl .Values.persistence.path $ | quote }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.environment "N8N_DIAGNOSTICS_ENABLED") }}
  N8N_DIAGNOSTICS_ENABLED: "false"
  {{- end }}
  {{- if not (hasKey .Values.configuration.environment "N8N_HIRING_BANNER_ENABLED") }}
  N8N_HIRING_BANNER_ENABLED: "false"
  {{- end }}
  {{- if and (.Values.license.existingSecret) (not (hasKey .Values.configuration.environment "N8N_LICENSE_TENANT_ID")) }}
  N8N_LICENSE_TENANT_ID: {{ .Values.license.tenantId | quote }}
  {{- end }}
  {{- if eq .Values.configuration.environment.DB_TYPE "postgresdb" }}
  {{- if not (hasKey .Values.configuration.environment "DB_POSTGRESDB_HOST") }}
  DB_POSTGRESDB_HOST: {{ tpl .Values.configuration.postgresdb.host $ | quote }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.environment "DB_POSTGRESDB_PORT") }}
  DB_POSTGRESDB_PORT: {{ .Values.configuration.postgresdb.port | quote }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.environment "DB_POSTGRESDB_DATABASE") }}
  DB_POSTGRESDB_DATABASE: {{ tpl .Values.configuration.postgresdb.database $ | quote }}
  {{- end }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.environment "N8N_PATH") }}
  # https://docs.n8n.io/hosting/configuration/configuration-examples/webhook-url/#configure-n8n-webhooks-with-reverse-proxy
  N8N_PATH: {{ include "graphwise-workflows.external-url.path" . | quote }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.environment "WEBHOOK_URL") }}
  N8N_WEBHOOK_URL: {{ include "graphwise-workflows.external-url" . | quote }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.environment "N8N_PORT") }}
  N8N_PORT: {{ .Values.containerPorts.http | quote }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.environment "N8N_RUNNERS_MODE") }}
  N8N_RUNNERS_MODE: {{ include "graphwise-workflows.runners.mode" . | quote }}
  {{- end }}
  {{- /* OIDC hook, see .Values.graphwiseOidc */}}
  {{- if not (hasKey .Values.configuration.environment "GRAPHWISE_OIDC_ENABLED") }}
  GRAPHWISE_OIDC_ENABLED: {{ .Values.graphwiseOidc.enabled | toString | quote }}
  {{- end }}
  {{- if .Values.graphwiseOidc.enabled }}
  {{- if not (hasKey .Values.configuration.environment "N8N_ADDITIONAL_NON_UI_ROUTES") }}
  # Keeps the UI router from serving index.html for the hook's /auth/oidc/* routes
  N8N_ADDITIONAL_NON_UI_ROUTES: "auth"
  {{- end }}
  {{- if not (hasKey .Values.configuration.environment "EXTERNAL_FRONTEND_HOOKS_URLS") }}
  EXTERNAL_FRONTEND_HOOKS_URLS: {{ printf "%sassets/oidc-frontend-hook.js" (include "graphwise-workflows.external-url.path" .) | quote }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.environment "GRAPHWISE_OIDC_ISSUER_URL") }}
  GRAPHWISE_OIDC_ISSUER_URL: {{ tpl .Values.graphwiseOidc.issuerUrl $ | quote }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.environment "GRAPHWISE_OIDC_CLIENT_ID") }}
  GRAPHWISE_OIDC_CLIENT_ID: {{ tpl .Values.graphwiseOidc.clientId $ | quote }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.environment "GRAPHWISE_OIDC_REDIRECT_URI") }}
  GRAPHWISE_OIDC_REDIRECT_URI: {{ include "graphwise-workflows.graphwiseOidc.redirect-uri" . | quote }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.environment "GRAPHWISE_OIDC_ALLOW_EMAIL_LOGIN") }}
  GRAPHWISE_OIDC_ALLOW_EMAIL_LOGIN: {{ .Values.graphwiseOidc.allowEmailLogin | toString | quote }}
  {{- end }}
  {{- end }}
  {{- /* Overrides from values.yaml */}}
  {{- if .Values.configuration.environment -}}
    {{- range $key, $value := .Values.configuration.environment -}}
      {{- if ne $value nil -}}
        {{- printf "%s: %s" $key (tpl ($value | toString) $ | quote) | nindent 2 -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
