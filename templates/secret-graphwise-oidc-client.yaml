{{- if and .Values.configuration.graphwiseOIDC.enabled (not .Values.configuration.graphwiseOIDC.clientSecret.existingSecret) .Values.configuration.graphwiseOIDC.clientSecret.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "graphwise-workflows.graphwiseOIDC.secrets.client.fullname" . }}
  namespace: {{ include "graphwise-workflows.namespace" . }}
  labels:
    {{- include "graphwise-workflows.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ .Values.configuration.graphwiseOIDC.clientSecret.secretKey }}: {{ .Values.configuration.graphwiseOIDC.clientSecret.secret | b64enc | quote }}
{{- end }}
