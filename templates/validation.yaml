{{- define "graphwise-workflows.validate.bootstrap" -}}
  {{- if .Values.bootstrap.enabled -}}
    {{- $image := required
        "bootstrap.image.repository must be configured for bootstrapping"
        .Values.bootstrap.image.repository
    -}}
    {{- $tag := required
        "bootstrap.image.tag or bootstrap.image.digest must be configured for bootstrapping"
        (coalesce .Values.bootstrap.image.tag .Values.bootstrap.image.digest)
    -}}
  {{- end -}}
{{- end -}}

{{- define "graphwise-workflows.validate.graphwiseOIDC" -}}
  {{- if .Values.configuration.graphwiseOIDC.enabled -}}
    {{- $issuerUrl := required "configuration.graphwiseOIDC.issuerUrl must be configured when configuration.graphwiseOIDC.enabled is true" .Values.configuration.graphwiseOIDC.issuerUrl -}}
    {{- $clientId := required "configuration.graphwiseOIDC.clientId must be configured when configuration.graphwiseOIDC.enabled is true" .Values.configuration.graphwiseOIDC.clientId -}}
    {{- $clientSecret := required
        "configuration.graphwiseOIDC.clientSecret.existingSecret or configuration.graphwiseOIDC.clientSecret.secret must be configured when configuration.graphwiseOIDC.enabled is true"
        (coalesce .Values.configuration.graphwiseOIDC.clientSecret.existingSecret .Values.configuration.graphwiseOIDC.clientSecret.secret)
    -}}
  {{- end -}}
{{- end -}}

{{- define "graphwise-workflows.validate" -}}
  {{- include "graphwise-workflows.validate.bootstrap" . -}}
  {{- include "graphwise-workflows.validate.graphwiseOIDC" . -}}
{{- end -}}

{{- include "graphwise-workflows.validate" . -}}
