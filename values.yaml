###############################################################################
# Main configuration file                                                     #
# To override single property use --set                                       #
# To override multiple, provide another values-override.yaml with the -f flag #
# See https://helm.sh/docs/chart_template_guide/values_files/                 #
###############################################################################

#########################
# Global Configurations #
#########################

global:
  # Overrides image.registry
  # Can be used to override it globally when using umbrella charts.
  imageRegistry: ""

  # Inserts additional pull secret references together along with any from .Values.image.pullSecrets
  # Can be used to override it globally when using umbrella charts.
  # Values are processed as Helm templates.
  # Ref: https://kubernetes.io/docs/concepts/configuration/secret/#using-imagepullsecrets
  #
  # Example:
  # imagePullSecrets:
  #   - name: my-pull-secret
  imagePullSecrets: []

###############################
#   Metadata Configurations   #
# Naming and labels overrides #
###############################

# Overrides the name of the chart affecting the names of the Workflows resources.
nameOverride: ""

# Overrides the naming of all Workflows resources, effectively removing the chart's name and the release name prefix.
# This override takes precedence over anything in .Values.nameOverride
fullnameOverride: ""

# Overrides the deployment namespace in case of multi-namespace deployments, for example when using umbrella charts where some sub-charts should be
# deployed in different namespaces.
# This affects every resource deployed by this chart.
# The default value is .Release.Namespace if this is left unspecified.
namespaceOverride: ""

# Additional common labels to add to all Workflows resources.
# Values are processed as Helm templates.
# Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
#
# Example:
# labels:
#   foo: bar
#   some-label: {{ .Values.someValue }}
labels: {}

# Additional common annotations to add to all Workflows resources.
# Values are processed as Helm templates.
# Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
#
# Example:
# annotations:
#   foo: bar
#   some-annotation: {{ .Values.someValue }}
annotations: {}

##################################
# Workflows Image Configurations #
##################################

# Image configurations for the Workflows services.
# Ref: https://kubernetes.io/docs/concepts/containers/images/
image:
  # The registry that hosts the Workflows image.
  registry: maven.ontotext.com

  # The repository name of the Workflows image.
  repository: graphwise-workflows

  # Image tag that corresponds to the version of the Workflows.
  # By default, the chart uses .Chart.AppVersion to construct the full image name.
  # Use this to override the value from .Chart.AppVersion and effectively deploy a custom Workflows version.
  tag: ""

  # Expected SHA256 digest of the used Workflows image, e.g. "sha256@abc"
  # Use the digest to make sure you are always deploying the exact same Workflows image.
  # Defining this would override .Chart.AppVersion and image.tag
  digest: ""

  # Defines the policy for pulling images
  # Ref: https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
  pullPolicy: IfNotPresent

  # Secrets for pulling Workflows image from secured registries.
  # This value is merged with any secrets defined in .Values.global.imagePullSecrets.
  # Values are processed as Helm templates.
  # Ref: https://kubernetes.io/docs/concepts/configuration/secret/#using-imagepullsecrets
  #
  # Example:
  # pullSecrets:
  #   - name: my-pull-secret
  pullSecrets: []

##########################
# Scaling Configurations #
##########################

# Number of Workflows pods to be deployed as part of the Deployment resources.
#
# IMPORTANT: This chart doesn't support multiple workers yet. Keep this at 1 until then.
replicas: 1

# Horizontal Pod Autoscaler configuration that can automatically scale the number of Workflows pods based on
# resource utilization.
# Ref: https://kubernetes.io/docs/concepts/workloads/autoscaling/
#
# IMPORTANT: This chart doesn't support multiple workers yet. Keep this disabled until then.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

######################################
#      Workflows Configurations      #
######################################

# A commercial license key is required for using enterprise features.
# Enabled when license.existingSecret is specifiued.
# Ref: https://docs.n8n.io/hosting/configuration/environment-variables/licenses/#license-environment-variables
license:
  # Reference to a Secret containing a field with the Workflows license key.
  # The value is processed as a Helm template.
  existingSecret: ""
  # Name of the key in the existing Secret that contains the license.
  # The default is N8N_LICENSE_ACTIVATION_KEY, but it can be changed to map to a different Secret key.
  licenseKey: N8N_LICENSE_ACTIVATION_KEY
  # Name of the key in the existing Secret that contains a specific tenant identifier.
  # When specified, this takes precedense over license.tenantId.
  # Prefer reading this from a secret over plain text license.tenantId.
  tenantIdKey:  # N8N_LICENSE_TENANT_ID
  # Dedicated tenant identifier for organizations using N8N Enterprise.
  tenantId: 1
  # Defines the license Secret as optional or not.
  optional: false

# Workflows runtime configuration settings.
configuration:
  # The external URL at which Graphwise Workflow engine would be accessible.
  # This can be a publicly available domain name, an internal one or even a Kubernetes service address.
  #
  # This configuration is used by the default ConfigMap to properly set the context paths for the Workflows.
  # It also configures the hostname in the default Ingress resource, if enabled.
  # The value is processed as a Helm template.
  #
  # Note: If the external URL uses HTTPS and the default Ingress is enabled, you have to configure .Values.ingress.tls
  #
  # Note: When deploying on a context path different from /, you need to properly configure the Ingress according to the requirements of the
  # Ingress controller implementation.
  externalUrl: https://workflows.127.0.0.1.nip.io/

  # Workflows configurations injected as environment variables via templates/configmap.yaml
  # The values are processed as Helm templates.
  # Ref: https://docs.n8n.io/deploy/host-n8n/configure-n8n/basic-configuration/use-environment-variables
  environment:
    DB_TYPE: "postgresdb"
    N8N_GRACEFUL_SHUTDOWN_TIMEOUT: "30"
    N8N_LOG_LEVEL: "info"
    N8N_METRICS: "true"
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    N8N_PROXY_HOPS: "1"
    # Task runners
    # See https://docs.n8n.io/deploy/host-n8n/configure-n8n/basic-configuration/use-environment-variables/task-runners#n8n-instance-environment-variables
    N8N_RUNNERS_MAX_PAYLOAD: 1073741824
    N8N_RUNNERS_MAX_CONCURRENCY: 5
    N8N_RUNNERS_TASK_TIMEOUT: 300
    N8N_RUNNERS_TASK_REQUEST_TIMEOUT: 60
    N8N_RUNNERS_BROKER_PORT: 5679

  # Encryption key for Workflows credentials.
  # By default, if not set, Workflows will generate a random key on startup and will use it to encrypt all credentials.
  # Ref: https://docs.n8n.io/deploy/host-n8n/configure-n8n/basic-configuration/use-environment-variables/deployment
  encryption:
    # Plain text encryption key. Use only for development and testing.
    # For production, prefer an existing Secret created outside the chart lifecycle.
    key: ""
    # When set to true, the chart will generate a random encryption key. Use only for development and testing.
    # For production, prefer an existing Secret created outside the chart lifecycle.
    autogenerate: false
    # Reference to a Secret containing a field with the encryption key.
    # The value is processed as a Helm template.
    existingSecret: ""
    # Name of the key in the existing Secret that contains the encryption key.
    # The default is N8N_ENCRYPTION_KEY, but it can be changed to map to a different Secret key.
    secretKey: N8N_ENCRYPTION_KEY

  # Configurations for connecting Workflows to a PostgreSQL database.
  # Ref: https://docs.n8n.io/hosting/configuration/environment-variables/database/#postgresql
  postgresdb:
    # Hostname of the PostgreSQL database.
    # The value is processed as a Helm template.
    host: postgres
    # Port of the PostgreSQL database.
    port: 5432
    # Name of the database to connect to in PostgreSQL.
    database: workflows
    # Credentials for connecting to the PostgreSQL database.
    credentials:
      # Reference to a Secret containing the credentials for connecting to the PostgreSQL database.
      # The value is processed as a Helm template.
      existingSecret: ""
      # Name of the key in the existing Secret that contains the username.
      usernameKey: DB_POSTGRESDB_USER
      # Name of the key in the existing Secret that contains the password.
      passwordKey: DB_POSTGRESDB_PASSWORD

##########################
# Ingress Configurations #
##########################

# Configurations for the default Ingress resource for Workflows.
#
# The default Ingress in this chart makes no assumptions of what Ingress controller is being used. It's up to you to
# define any specific annotations required by the controller implementation in your cluster.
#
# Ref: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  # Toggles the deployment of the default Ingress resource.
  enabled: true
  # Specifies the ingress controller implementation that will control this Ingress resource.
  # Not defining this would result in using the default ingress controller in the cluster, if there is one.
  className: ""
  # Additional labels to append to the Ingress resource.
  # Values are processed as Helm templates.
  labels: {}
  # Additional annotations to append to the Ingress resource.
  # Values are processed as Helm templates.
  annotations: {}
  # The domain on which the Workflows service will be exposed via Ingress.
  # If set, overrides the host from .Values.configuration.externalUrl
  host: ""
  # The context path on which the Workflows service will be accessible via Ingress.
  # If set, overrides the context path from .Values.configuration.externalUrl
  path: ""
  # Sets the ingress path type.
  # If you need to use ImplementationSpecific, make sure to set any annotations needed by the controller implementation.
  pathType: Prefix
  # Configures SSL termination on Ingress level.
  # Ref: https://kubernetes.github.io/ingress-nginx/examples/tls-termination/
  tls:
    # Feature toggle for SSL termination. Disabled by default.
    enabled: false
    # Name of a Kubernetes Secret object with the key and certificate.
    # If TLS is enabled, it's required to be provided, depending on the deployment.
    # This could be an existing Secret or one that is not yet created.
    secretName: ""
  # List of additional hostnames to append to the Ingress resource.
  # Values are processed as Helm templates.
  extraHosts: []
  # List of additional TLS records to append to the Ingress resource.
  # Values are processed as Helm templates.
  extraTLS: []

##########################
# Service Configurations #
##########################

# Configurations for Workflows Service.
# Ref: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # Enables or disables the Service deployment
  enabled: true
  # Additional labels to append to the Service resource.
  # Values are processed as Helm templates.
  labels: {}
  # Additional annotations to append to the Service resource.
  # Values are processed as Helm templates.
  annotations: {}
  # Service type
  # Ref: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # Instructs if DNS records are created for not-ready Pods.
  publishNotReadyAddresses: false
  # Ports exposed by the Service.
  # Note: If you want to add additional ports, use .Values.service.extraPorts.
  ports:
    # Port mapped to Workflows HTTP API.
    http: 5678
  # Exposes the Service on a specific node port on the host machine when "serviceType: NodePort"
  # If left undefined, K8S will pick a random port from the node port range of the cluster.
  nodePort: ""
  # Defines the policy for treating external ingress traffic.
  # By default, Cluster does not preserve client IPs. Change to Local to preserve them.
  # See https://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip
  externalTrafficPolicy: ""
  # NodePort used by external load balancers when the external traffic policy is set to Local.
  # By default, Kubernetes will assign a random port, use this to override it.
  healthCheckNodePort: ""
  # Defines the class that should select a particular load balancer implementation.
  # By default, Kubernetes will assign the cluster default implementation, use this to override it.
  # Ref: https://kubernetes.io/docs/concepts/services-networking/service/#load-balancer-class
  loadBalancerClass: ""
  # Source IP ranges for restricting external ingress traffic
  loadBalancerSourceRanges: []
  # External IP addresses at which the Service will be exposed
  # Ref: https://kubernetes.io/docs/concepts/services-networking/service/#external-ips
  externalIPs: []
  # Additional ports to expose with the Service.
  extraPorts: []

##############################
# Persistence Configurations #
##############################

persistence:
  # Toggles the persistence of Workflows data.
  # By default, this is disabled and the chart will fall back to using an empyDir volume.
  #
  # - If enabled, the Deployment will use a PVC template and rely on the CSI to dynamically provision Persistent Volumes.
  # - If disabled, it falls back to an emptyDir volume unless an existing PVC is provided with .Values.persistence.existingVolumeClaim.
  enabled: false

  # Storage location inside the container where the PersistenceClaimVolume will be mounted at.
  # The value is processed as a Helm template.
  path: /var/lib/graphwise/workflows

  # Configurations for PVC persistence.
  # By default, the PVC does not declare a particular storage class, allowing the CSI to select the default storage class in the cluster.
  # Ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
  volumeClaim:
    # Additional labels to add to the PVC.
    # Values are processed as Helm templates.
    labels: {}
    # Additional annotations to add to the PVC template.
    # Values are processed as Helm templates.
    annotations: {}
    # Specification for a PVC to be created for the Workflows Deployment.
    # Values are processed as Helm templates.
    # Tune the spec according to your needs.
    spec:
      # To define a particular storage class, uncomment the following line and provide the name of the desired class.
      # storageClassName: standard
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi

  # Existing PersistentVolumeClaim to attach to the Workflows Deployment for persistent storage.
  # Providing an existing PVC will disable the creation of the default PVC in this chart.
  # Value is processed as a Helm template.
  existingVolumeClaim: ""

  # Configurations for an emptyDir volume to be used for data storage by the Deployment.
  # Used when the persistence is disabled with .Values.persistence.enabled and no existing PVC is provided.
  # Ref: https://kubernetes.io/docs/concepts/storage/ephemeral-volumes/
  emptyDir:
    # Default emptyDir limit, override to your needs.
    sizeLimit: 1Gi

# Configurations for an emptyDir volume for the /tmp folder.
# Because the default security context in .Values.securityContext configures the root filesystem to be in read-only mode,
# certain Workflows features cannot create and write files in /tmp. If you don't use a read-only root filesystem, you
# can disable this with .Values.tempVolume.enabled
tempVolume:
  # Toggles the temp folder emptyDir volume creation.
  # - If enabled, the Deployment will use an emptyDir volume for /tmp.
  # - If disabled, the chart won't create and mount ephemeral volumes for /tmp.
  enabled: true

  # Configurations for an emptyDir volume to be used for /tmp.
  # Ref: https://kubernetes.io/docs/concepts/storage/ephemeral-volumes/
  emptyDir:
    # Default emptyDir limit, override to your needs.
    sizeLimit: 128Mi

#############################
# Deployment Configurations #
#############################

# Configures the strategy of updating Deployment Pods.
# Ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#updating-a-deployment
updateStrategy:
  type: Recreate

# Changes the maximum number of revisions that are kept.
revisionHistoryLimit: 10

# Grace period in seconds before terminating the Pods.
# Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#pod-termination
terminationGracePeriodSeconds: 120

# Toggles the auto-mounting of API credentials token into the Pods.
# Enable this if you need to contact either the API server or need web identity credentials for federated authentication in cloud APIs.
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/#opt-out-of-api-credential-automounting
automountServiceAccountToken: false

# Overrides the default Kubernetes scheduler.
# See https://kubernetes.io/docs/tasks/extend-kubernetes/configure-multiple-schedulers/#specify-schedulers-for-pods
schedulerName: ""

# Overrides the Pod's DNS settings.
# Ref: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-dns-config
dnsConfig: {}

# Defines the Pod's policy for DNS resolution.
# Ref: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-s-dns-policy
dnsPolicy: ""

# Name of an existing PriorityClass to assign, defining the importance of the pods compared to other pods in the cluster.
# Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
priorityClassName: ""

# Overrides the default Workflows container command.
# Use only for troubleshooting!
# See https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/
command: []

# Overrides the default Workflows container command's arguments.
# Use only for troubleshooting!
# See https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/
args: []

# Ports used by the Workflows container
# Note: If you want to add additional ports, use .Values.extraContainerPorts.
containerPorts:
  # Port mapped to the Workflows listener.
  http: 5678

# Additional labels to append to the Pod definition.
# Values are processed as Helm templates.
# Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# Additional annotations to append to the Pod definition.
# Values are processed as Helm templates.
# Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}

###################################
# Security Context Configurations #
###################################

# Defines privilege and access control settings for all containers in the Workflows Pods.
# See https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# Defines privilege and access control settings for the container running the Workflows.
# See https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

#############################
# Scheduling Configurations #
#############################

# Selector labels to match when selecting nodes.
# Values are processed as Helm templates.
# Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
# See https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes/
nodeSelector: {}

# Node and pod affinity and anti-affinity configurations for constraining the Pod scheduling.
# Values are processed as Helm templates.
# Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
affinity: {}

# Default podAntiAffinity rule ensuring that Workflows pods are scheduled on different Kubernetes nodes.
#
# Possible values for .Values.podAntiAffinity.preset are:
# - "soft" (default) - Configures a preferredDuringSchedulingIgnoredDuringExecution rule.
# - "hard" - Configures a requiredDuringSchedulingIgnoredDuringExecution rule.
# Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
podAntiAffinity:
  enabled: true
  preset: soft
  topology: kubernetes.io/hostname

# List of taint tolerations.
# Values are processed as Helm templates.
# Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
tolerations: []

# Configurations for spreading Pods across different failure domains.
# Values are processed as Helm templates.
# Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#pod-topology-spread-constraints
# Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
topologySpreadConstraints: []

##########################
# Resource Configuration #
##########################

# Resource configurations for the Workflows containers.
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes/
# Ref: https://docs.n8n.io/hosting/installation/server-setups/google-kubernetes-engine/#pod-resources
resources:
  limits:
    memory: 1Gi
  requests:
    memory: 512Mi
    cpu: 100m

#########################
# Probes Configurations #
#########################

# Ref: https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
# Ref: https://docs.n8n.io/hosting/logging-monitoring/monitoring/#healthz-and-healthzreadiness

# Configurations for the Workflows container startup probe.
startupProbe:
  httpGet:
    path: /healthz/readiness
    port: http
    scheme: HTTP
  failureThreshold: 300
  timeoutSeconds: 1
  periodSeconds: 3

# Configurations for the Workflows container readiness probe.
readinessProbe:
  httpGet:
    path: /healthz/readiness
    port: http
    scheme: HTTP
  timeoutSeconds: 5
  periodSeconds: 10

# Configurations for the Workflows container liveness probe.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
    scheme: HTTP
  initialDelaySeconds: 60
  timeoutSeconds: 5
  periodSeconds: 10

########################################
# Additional Deployment Configurations #
########################################

# Additional environment variables to be set for the Workflows containers.
# Values are processed as Helm templates.
extraEnvFrom: []

# Additional environment variables to be set for the Workflows containers.
# Values are processed as Helm templates.
extraEnv: []

# Additional volumes to be set for the Workflows Pod.
# Values are processed as Helm templates.
extraVolumes: []

# Additional volume mounts to be set for the Workflows containers.
# Values are processed as Helm templates.
extraVolumeMounts: []

# Additional init containers to be inserted after the init containers.
# Values are processed as Helm templates.
extraInitContainers: []

# Additional Workflows container ports to expose.
extraContainerPorts: {}

# Additional containers to insert into the Workflows Pod, e.g. sidecar containers
# Values are processed as Helm templates.
extraContainers: []

########################################
# Pod Disruption Budget Configurations #
########################################

# Configurations for Workflows default Pod Disruption Budget.
# Ref: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/#pod-disruption-budgets
podDisruptionBudget:
  enabled: true
  unhealthyPodEvictionPolicy: AlwaysAllow
  # This effectively tolerates a disruption.
  # Tune these values based on your needs.
  maxUnavailable: 1
  minAvailable: ""

##################################
# Service Account Configurations #
##################################

# Configurations for the default ServiceAccount for Workflows.
# Ref: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a ServiceAccount should be created for Workflows.
  create: false

  # The name of the ServiceAccount to use.
  #
  # There are three cases to be aware of when using this:
  # - If not set and create is true, a name is generated using the fullname template
  # - If set and create is true, it will use the provided name when creating the ServiceAccount
  # - If set but create is false, it will use the provided ServiceAccount.
  name: ""

  # If .Values.serviceAccount.create is true, insert additional annotations to the created ServiceAccount.
  # Values are processed as Helm templates.
  annotations: {}

##########################
# Workflows Task Runners #
##########################

# The chart can be configured to run tasks runners as a side-car container next to the main Workflows container.
# This is useful for cases where the main Workflows container is not equipped with the necessary binaries or libraries
# or simply for better task isolation.

runners:
  # Toggles the Workflows task runners deployment mode: external or internal
  # - When set to true, the chart will deploy the task runners as a side-car container that attaches to the Workflows instance
  # - When set to false, the chart will configure the main Workflows instance to use internal task runners
  external: false

  ###############################################
  # Workflows Task Runners Image Configurations #
  ###############################################

  # Image configurations for the Workflows task runners.
  # Ref: https://kubernetes.io/docs/concepts/containers/images/
  image:
    # The registry that hosts the Workflows task runners image.
    registry: maven.ontotext.com

    # The repository name of the Workflows task runners image.
    repository: graphwise-runners

    # Image tag that corresponds to the version of the Workflows task runners.
    tag: 1.0.0-M1

    # Expected SHA256 digest of the used Workflows task runners image, e.g. "sha256@abc"
    # Use the digest to make sure you are always deploying the exact same Workflows task runners image.
    # Defining this would override runners.image.tag
    digest: ""

    # Defines the policy for pulling images
    # Ref: https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
    pullPolicy: IfNotPresent

  #########################################
  # Workflows Task Runners Configurations #
  #########################################

  # Workflows Task Runners configuration settings.
  configuration:
    # Environment variables to be set for the Workflows task runners, injected as a ConfigMap
    # Values are processed as Helm templates.
    # See https://docs.n8n.io/deploy/host-n8n/configure-n8n/basic-configuration/use-environment-variables/task-runners#task-runner-launcher-environment-variables
    environment:
      N8N_RUNNERS_LAUNCHER_LOG_LEVEL: info
      N8N_RUNNERS_TASK_BROKER_URI: http://127.0.0.1:5679
      N8N_RUNNERS_MAX_PAYLOAD: 1073741824
      N8N_RUNNERS_MAX_CONCURRENCY: 5
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: 15

    # Authentication token for the Workflows task runners and the main Workflows instances.
    token:
      # Plain text authentication token. Use only for development and testing.
      # For production, prefer an existing Secret created outside the chart lifecycle.
      token: ""
      # When set to true, the chart will generate a random authentication token. Use only for development and testing.
      # For production, prefer an existing Secret created outside the chart lifecycle.
      autogenerate: false
      # Reference to a Secret containing a field with the authentication token.
      # The value is processed as a Helm template.
      existingSecret: ""
      # Name of the key in the existing Secret that contains the authentication token.
      # The default is N8N_RUNNERS_AUTH_TOKEN, but it can be changed to map to a different Secret key.
      tokenKey: N8N_RUNNERS_AUTH_TOKEN

  ###########################################
  # Task Runners Persistence Configurations #
  ###########################################

  # Persistence configuration for the Workflows task runners.
  persistence:
    # Shared volume for storing data between Workflows instances and the task runners.
    shared:
      # Toggles the shared volume creation.
      # - If enabled, the Deployment will use an ephemeral emptyDir to store the shared data.
      enabled: true
      # Storage location inside the containers where the shared volume will be mounted at.
      mountPath: /home/node/.n8n-files
      # Configurations for an ephemeral emptyDir volume to be used for shared data storage between Workflows instances
      # and task runners.
      # Ref: https://kubernetes.io/docs/concepts/storage/ephemeral-volumes/
      emptyDir:
        # Default emptyDir limit, override to your needs.
        sizeLimit: 1Gi

  #########################################
  # Task Runners Deployment Configuration #
  #########################################

  # Ports used by the Workflows task runners container
  # Note: If you want to add additional ports, use .Values.runners.extraContainerPorts.
  containerPorts:
    # Port mapped to the Workflows task runners listener.
    http: 5680

  # Defines privilege and access control settings for the container running the Workflows task runners.
  # See https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  #######################################
  # Task Runners Resource Configuration #
  #######################################

  # Resource configurations for the Workflows task runners containers.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes/
  # Ref: https://docs.n8n.io/hosting/installation/server-setups/google-kubernetes-engine/#pod-resources
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 256Mi
      cpu: 100m

  ######################################
  # Task Runners Probes Configurations #
  ######################################

  # Ref: https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
  # Ref: https://docs.n8n.io/hosting/logging-monitoring/monitoring/#healthz-and-healthzreadiness

  # Configurations for the Workflows task runners container startup probe.
  startupProbe:
    httpGet:
      path: /healthz
      port: http-runners
      scheme: HTTP
    failureThreshold: 300
    timeoutSeconds: 1
    periodSeconds: 3

  # Configurations for the Workflows task runners container readiness probe.
  readinessProbe:
    httpGet:
      path: /healthz
      port: http-runners
      scheme: HTTP
    timeoutSeconds: 5
    periodSeconds: 10

  # Configurations for the Workflows task runners container liveness probe.
  livenessProbe:
    httpGet:
      path: /healthz
      port: http-runners
      scheme: HTTP
    initialDelaySeconds: 60
    timeoutSeconds: 5
    periodSeconds: 10

  #####################################################
  # Additional Task Runners Deployment Configurations #
  #####################################################

  # Additional environment variables to be set for the Workflows task runners containers.
  # Values are processed as Helm templates.
  extraEnvFrom: []

  # Additional environment variables to be set for the Workflows  task runners containers.
  # Values are processed as Helm templates.
  extraEnv: []

  # Additional volume mounts to be set for the Workflows  task runners containers.
  # Values are processed as Helm templates.
  extraVolumeMounts: []

  # Additional Workflows container ports to expose.
  extraContainerPorts: {}

  # Overrides the default Workflows task runners container command.
  # Use only for troubleshooting!
  # See https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/
  command: []

  # Overrides the default Workflows task runners container command's arguments.
  # Use only for troubleshooting!
  # See https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/
  args: []

######################################
# Workflows Bootstrap Configurations #
######################################

# The chart can be configured to deploy a Job resource that will bootstrap the Graphwise Workflows instance
# with a baseline set of workflows, credentials and other necessary data, from a given container image that
# connects to the database.

bootstrap:
  # Toggles the bootstrap Job deployment.
  # - When set to true, the chart will deploy a Job resource as a Helm chart hook that will bootstrap the Graphwise Workflows instance.
  # - When set to false, the chart will not deploy the Job resource.
  enabled: false

  # Container image configurations for the bootstrap Job.
  # You need to define the actual image that will be used for bootstrapping.
  # Ref: https://kubernetes.io/docs/concepts/containers/images/
  image:
    # The registry that hosts the Workflows bootstrap image.
    registry: maven.ontotext.com

    # The repository name of the Workflows bootstrap image.
    repository: ""

    # Image tag that corresponds to the version of the Workflows bootstrap image.
    tag: ""

    # Expected SHA256 digest of the used Workflows bootstrap image, e.g. "sha256@abc"
    # Use the digest to make sure you are always deploying the exact same Workflows bootstrap image.
    # Defining this would override bootstrap.image.tag
    digest: ""

    # Defines the policy for pulling images
    # Ref: https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
    pullPolicy: IfNotPresent

    # Secrets for pulling Workflows bootstrap image from secured registries.
    # This value is merged with any secrets defined in .Values.global.imagePullSecrets.
    # Values are processed as Helm templates.
    # Ref: https://kubernetes.io/docs/concepts/configuration/secret/#using-imagepullsecrets
    #
    # Example:
    # pullSecrets:
    #   - name: my-pull-secret
    pullSecrets: []

    # Image configurations for the bootstrap Job init container with curl.
    # The job executes an init container with curl that waits for the Workflows to be ready before proceeding.
    # This includes any migrations that the Workflows might perform, so it is important to wait for them to complete.
    curl:
      registry: docker.io
      repository: alpine/curl
      tag: 8.21.0
      digest: ""
      pullPolicy: IfNotPresent

  #############################################
  # Bootstrap Job Hook Configuration Settings #
  #############################################

  # Configurations for the Kubernetes Job created by Helm as a chart hook.
  # Ref: https://helm.sh/docs/topics/charts_hooks/
  # Ref: https://kubernetes.io/docs/concepts/workloads/controllers/job/
  hook:
    # Helm chart hook annotations to add to the Job resource.
    # Controls the execution lifecycle of the Job.
    annotations:
      # You can use post-upgrade as well
      helm.sh/hook: post-install
      helm.sh/hook-delete-policy: before-hook-creation, hook-succeeded
      helm.sh/hook-weight: "10"

  configuration:
    # Timeout in seconds for the init container that waits for the Workflows to be ready.
    # Once this timeout is reached, Kubernetes will restart the init container.
    # If you wish to enforce a hard timeout without further restarts, use bootstrap.activeDeadlineSeconds
    wait_timeout: 60s

  ########################################
  # Bootstrap Job Configuration Settings #
  ########################################

  # The number of retries before marking the Job as failed.
  backoffLimit: 10

  # Duration in seconds relative to the startTime before the Job is cleaned up.
  ttlSecondsAfterFinished: 120

  # Maximum duration in seconds relative to the startTime that the job may be running before terminated.
  activeDeadlineSeconds: ""

  ##############################
  # Bootstrap Job Pod Settings #
  ##############################

  # Overrides the default Kubernetes scheduler.
  # See https://kubernetes.io/docs/tasks/extend-kubernetes/configure-multiple-schedulers/#specify-schedulers-for-pods
  schedulerName: ""

  # Overrides the Job's DNS settings.
  # Ref: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-dns-config
  dnsConfig: {}

  # Defines the Job's policy for DNS resolution.
  # Ref: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-s-dns-policy
  dnsPolicy: ""

  # Name of an existing PriorityClass to assign, defining the importance of the pods compared to other pods in the cluster.
  # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
  priorityClassName: ""

  # Overrides the default Workflows bootstrap container command.
  # Use only for troubleshooting!
  # See https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/
  command: []

  # Overrides the default Workflows bootstrap container command's arguments.
  # Use only for troubleshooting!
  # See https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/
  args: []

  #################################################
  # Bootstrap Job Security Context Configurations #
  #################################################

  # Defines privilege and access control settings for all containers in the bootstrap Job.
  # See https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  # Defines privilege and access control settings for the bootstrap containers.
  # See https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  ###########################################
  # Bootstrap Job Scheduling Configurations #
  ###########################################

  # Selector labels to match when selecting nodes.
  # Values are processed as Helm templates with the tpl function.
  # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
  # See https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes/
  nodeSelector: {}

  # Node and pod affinity & anti-affinity configurations for constraining the Pod scheduling.
  # Values are processed as Helm templates.
  # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  affinity: {}

  # List of taint tolerations.
  # Values are processed as Helm templates.
  # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  tolerations: []

  # Configurations for spreading Pods across different failure domains.
  # Values are processed as Helm templates.
  # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#pod-topology-spread-constraints
  # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
  topologySpreadConstraints: []

  ########################################
  # Bootstrap Job Resource Configuration #
  ########################################

  # Resource configurations for the bootstrap Job containers.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes/
  resources:
    limits:
      memory: 64Mi
    requests:
      memory: 64Mi
      cpu: 50m

  ###############################################
  # Bootstrap Job Additional Pod Configurations #
  ###############################################

  # Additional environment variables to be set for the Workflows bootstrap containers.
  # Values are processed as Helm templates.
  extraEnvFrom: []

  # Additional environment variables to be set for the Workflows bootstrap containers.
  # Values are processed as Helm templates.
  extraEnv: []

  # Additional volumes to be set for the Workflows bootstrap containers.
  # Values are processed as Helm templates.
  extraVolumes: []

  # Additional volume mounts to be set for the Workflows bootstrap containers.
  # Values are processed as Helm templates.
  extraVolumeMounts: []

  # Additional init containers to be inserted after the bootstrap init containers.
  # Values are processed as Helm templates.
  extraInitContainers: []

  # Additional containers to insert into the Workflows bootstrap Job
  # Values are processed as Helm templates.
  extraContainers: []

#################################
# Additional Kubernetes Objects #
#################################

# Additional objects to insert along with the release.
# Values are processed as Helm templates with tpl function.
# Ref: https://helm.sh/docs/howto/charts_tips_and_tricks/#using-the-tpl-function
extraObjects: []
